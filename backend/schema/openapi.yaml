openapi: 3.0.3
info:
  title: Commerce API
  version: 1.0.0
  description: Storefront and administration API. Money amounts are integer paise
    (INR).
paths:
  /api/v1/account/addresses/:
    get:
      operationId: account_addresses_list
      description: 'Customer-owned resources: queryset is always scoped to the requesting
        user (no IDOR).'
      tags:
      - account
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
          description: ''
    post:
      operationId: account_addresses_create
      description: 'Customer-owned resources: queryset is always scoped to the requesting
        user (no IDOR).'
