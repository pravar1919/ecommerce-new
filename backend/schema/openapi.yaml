components:
  schemas:
    AccentEnum:
      enum:
      - burgundy
      - emerald
      - royal
      type: string
      description: |-
        * `burgundy` - Burgundy
        * `emerald` - Emerald
        * `royal` - Royal blue
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 120
        phone:
          type: string
          description: +91XXXXXXXXXX
          maxLength: 13
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        landmark:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 80
        state_code:
          $ref: '#/components/schemas/StateCodeEnum'
        state_name:
          type: string
          readOnly: true
        pincode:
          type: string
          maxLength: 6
        country:
          type: string
          readOnly: true
        gstin:
          type: string
          description: Optional, for B2B invoices
          maxLength: 15
        is_default_shipping:
          type: boolean
        is_default_billing:
          type: boolean
      required:
      - city
      - country
      - full_name
      - id
      - line1
      - phone
      - pincode
      - state_code
      - state_name
    AddressRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 1
          description: +91XXXXXXXXXX
          maxLength: 13
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        landmark:
          type: string
          maxLength: 120
        city:
          type: string
          minLength: 1
          maxLength: 80
        state_code:
          $ref: '#/components/schemas/StateCodeEnum'
        pincode:
          type: string
          minLength: 1
          maxLength: 6
        gstin:
          type: string
          description: Optional, for B2B invoices
          maxLength: 15
        is_default_shipping:
          type: boolean
        is_default_billing:
          type: boolean
      required:
      - city
      - full_name
      - line1
      - phone
      - pincode
      - state_code
    AppliesToEnum:
      enum:
      - body
      - garment
      - both
      type: string
      description: |-
        * `body` - Body
        * `garment` - Garment
        * `both` - Body and garment
    CategoryDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        path:
          type: string
          readOnly: true
          description: e.g. wedding/sherwanis
        eyebrow:
          type: string
          description: Small label above the title
          maxLength: 80
        description:
          type: string
          description: Editorial intro shown on the category page
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRef'
          readOnly: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRef'
        seo:
          allOf:
          - $ref: '#/components/schemas/Seo'
          readOnly: true
      required:
      - breadcrumbs
      - children
      - id
      - name
      - path
