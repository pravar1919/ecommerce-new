components:
  schemas:
    AccentEnum:
      enum:
      - burgundy
      - emerald
      - royal
      type: string
      description: |-
        * `burgundy` - burgundy
        * `emerald` - emerald
        * `royal` - royal
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 120
        phone:
          type: string
          description: +91XXXXXXXXXX
          maxLength: 13
        line1:
          type: string
          maxLength: 200
        line2:
