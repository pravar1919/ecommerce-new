      required:
      - categories
      - products
      - queries
    Variant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sku:
          type: string
          maxLength: 64
        colour:
          type: string
          readOnly: true
        size:
          type: string
          nullable: true
          readOnly: true
        price:
          allOf:
          - $ref: '#/components/schemas/Price'
          readOnly: true
        inventory_policy:
          $ref: '#/components/schemas/InventoryPolicyEnum'
        stock_status:
          allOf:
          - $ref: '#/components/schemas/StockStatusEnum'
          readOnly: true
        low_stock_quantity:
          type: integer
          nullable: true
          readOnly: true
      required:
      - colour
      - id
      - low_stock_quantity
      - price
      - size
      - sku
      - stock_status
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
