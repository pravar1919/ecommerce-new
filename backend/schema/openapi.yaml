      - in: query
        name: in_stock
        schema:
          type: string
      - in: query
        name: occasion
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
